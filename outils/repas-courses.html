<title>Repas & Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a plain phone app. Text and thin rules carry the structure; boxes only where something is a separate object.
   Bottom tab bar on phones, left rail from 960px. One typeface built for legibility; prices close each line like a till receipt. */
:root {
  --bg: #F6F7F5;
  --surface: #FFFFFF;
  --ink: #141A16;
  --muted: #59625C;
  --faint: #8A928C;
  --line: #DCE0DB;
  --accent: #1D6A44;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EFE7;
  --warn: #A4500F;
  --warn-soft: #F9EADC;
  --danger: #B0281F;
  --scrim: rgba(10, 14, 12, .45);
  --font: "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: var(--font);
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1210; --surface: #161B18; --ink: #E8ECE9; --muted: #A0A9A3; --faint: #727B75; --line: #2A312C;
    --accent: #6CC495; --accent-ink: #062014; --accent-soft: #17301F; --warn: #F0A262; --warn-soft: #36230F; --danger: #F08A7F;
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1210; --surface: #161B18; --ink: #E8ECE9; --muted: #A0A9A3; --faint: #727B75; --line: #2A312C;
  --accent: #6CC495; --accent-ink: #062014; --accent-soft: #17301F; --warn: #F0A262; --warn-soft: #36230F; --danger: #F08A7F;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.2; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.money { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 18px; }
.btn.danger { background: var(--danger); color: var(--surface); box-shadow: none; }
.link { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.input { width: 100%; min-height: 50px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 17px; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { min-height: 84px; resize: vertical; }

/* Shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 680px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.topbar b { font-size: 18px; }
.topbar span { color: var(--muted); font-size: 15px; }
.content { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 20px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 24px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--faint); position: relative; }
.tab .ic { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .count { position: absolute; top: 7px; left: calc(50% + 9px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12px; display: grid; place-items: center; font-family: var(--mono); }
.tab .count:empty { display: none; }
@media (min-width: 960px) {
  .tabbar { top: 0; right: auto; width: 220px; border-top: 0; border-right: 1px solid var(--line); padding: 72px 12px 12px; }
  .tabbar-in { grid-template-columns: 1fr; height: auto; gap: 2px; }
  .tab { grid-auto-flow: column; justify-content: start; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; }
  .tab[aria-selected="true"] { background: var(--accent-soft); }
  .tab .count { position: static; margin-left: auto; }
  .topbar { margin-left: 220px; }
  .topbar-in { margin-left: max(16px, calc((100vw - 220px - 680px) / 2)); }
  .content { margin-left: max(236px, calc(220px + (100vw - 220px - 680px) / 2)); padding-bottom: 48px; }
  .toast { left: 236px !important; }
}

/* Page heads + plain sections */
.head { display: grid; gap: 4px; }
.head p { color: var(--muted); }
.section { display: grid; gap: 10px; }
.section > .label { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pad { padding: 16px; }

/* Status line (automation messages) */
.status { display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); }
.status .ic { color: var(--accent); margin-top: 2px; }
.status.warn { background: var(--warn-soft); }
.status.warn .ic { color: var(--warn); }
.status b { display: block; }
.status p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.status .acts { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }

/* Budget line */
.budget { display: grid; gap: 8px; }
.budget .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.budget .total { font-family: var(--mono); font-size: 26px; font-weight: 700; }
.budget .of { color: var(--muted); }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter.over i { background: var(--danger); }
.budget .note { font-size: 15px; color: var(--muted); }
.budget .note.over { color: var(--danger); font-weight: 700; }

/* Today */
.today { display: grid; }
.today .when { padding: 14px 16px 4px; font-weight: 700; }
.mrow { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; width: 100%; border-top: 1px solid var(--line); }
.today .when + .mrow { border-top: 0; }
.mrow .slot { font-size: 14px; color: var(--muted); font-weight: 700; }
.mrow .name { font-weight: 700; line-height: 1.3; }
.mrow .meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
.mrow .go { color: var(--faint); }
.mrow.busy { opacity: .5; pointer-events: none; }
.ahead { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 16px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--warn); }
.ahead b { color: var(--ink); }

/* Week list */
.week { display: grid; }
.wday { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.wday:first-child { border-top: 0; }
.wday .d { font-weight: 700; line-height: 1.2; }
.wday .d small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.wday.past { opacity: .5; }
.wday.now .d { color: var(--accent); }
.wmeals { display: grid; gap: 8px; }
.wmeal { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; width: 100%; }
.wmeal .n { font-weight: 700; line-height: 1.3; }
.wmeal .s { font-size: 14px; color: var(--muted); font-weight: 400; }
.wmeal .m { font-size: 14px; color: var(--muted); white-space: nowrap; }
.wmeal.busy { opacity: .5; pointer-events: none; }
.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 16px; }

/* Shopping list (till receipt) */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.seg button { min-height: 44px; border-radius: 9px; font-weight: 700; color: var(--muted); text-align: center; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); }
.progress-line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 16px; }
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.aisle { display: grid; }
.aisle .label { padding: 18px 0 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.line { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.tick { position: relative; width: 28px; height: 28px; }
.tick input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.tick span { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; }
.tick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tick input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.line .main { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; align-items: baseline; min-width: 0; }
.line .prod { font-weight: 700; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.line .price { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.line .sub { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin-top: 3px; }
.line .why { grid-column: 1 / -1; font-size: 14px; color: var(--warn); margin-top: 2px; }
.line .acts { grid-column: 1 / -1; display: flex; gap: 18px; margin-top: 6px; font-size: 15px; }
.line.done .prod, .line.done .price { text-decoration: line-through; color: var(--faint); }
.line.done .acts, .line.done .why { display: none; }
.receipt-total { display: flex; justify-content: space-between; padding: 14px 0; border-top: 2px solid var(--ink); font-weight: 700; margin-top: -1px; }

/* Drive mode */
.drive { display: grid; gap: 12px; }
.drive .count { font-family: var(--mono); color: var(--muted); }
.dcard { display: grid; gap: 10px; padding: 20px; }
.dcard .aisle-name { color: var(--muted); font-size: 15px; }
.dcard .prod { font-size: 24px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.dcard .qty { color: var(--muted); }
.dcard .why { color: var(--warn); font-size: 15px; }
.dcard .price { font-family: var(--mono); font-size: 20px; }
.drow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.copied { font-size: 15px; color: var(--accent); font-weight: 700; min-height: 22px; }
.next-up { font-size: 15px; color: var(--muted); }

/* Settings */
.rows { display: grid; }
.srow { display: grid; grid-template-columns: 1fr auto 16px; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); width: 100%; }
.srow .k { font-weight: 700; }
.srow .v { color: var(--muted); font-size: 15px; text-align: right; max-width: 48vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .ic { color: var(--faint); }
.toggle { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.toggle b { display: block; }
.toggle small { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.toggle input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; cursor: pointer; margin: 2px 0 0; flex: none; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(20px); }
.fine { font-size: 14px; color: var(--muted); }

/* Onboarding */
.ob { max-width: 560px; margin: 0 auto; padding-inline: 16px; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
.ob-top { display: flex; align-items: center; gap: 12px; padding-block: 14px; min-height: 72px; }
.ob-back { min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 10px; }
.ob-step { color: var(--muted); font-size: 15px; font-family: var(--mono); }
.ob-bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.ob-bar i { display: block; height: 100%; background: var(--accent); }
.ob-body { display: grid; align-content: start; gap: 18px; padding-block: 8px 24px; }
.ob-body .lead { color: var(--muted); }
.ob-body .q { font-weight: 700; margin-top: 6px; }
.ob-foot { position: sticky; bottom: 0; padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.choices { display: grid; }
.choice { display: grid; grid-template-columns: 24px 1fr; gap: 14px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); width: 100%; }
.choice:first-child { border-top: 1px solid var(--line); }
.choice .r { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); margin-top: 1px; display: grid; place-items: center; }
.choice[aria-pressed="true"] .r { border-color: var(--accent); }
.choice[aria-pressed="true"] .r::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.choice b { display: block; }
.choice small { display: block; color: var(--muted); font-size: 15px; margin-top: 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tagbtn { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; }
.tagbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.counter { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.counter:first-of-type { border-top: 1px solid var(--line); }
.counter small { display: block; color: var(--muted); font-size: 15px; }
.counter .ctl { display: flex; align-items: center; gap: 12px; }
.counter .ctl button { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.counter .ctl strong { font-family: var(--mono); font-size: 22px; min-width: 2ch; text-align: center; }
.amount { display: flex; align-items: baseline; gap: 8px; }
.amount input { width: 3.2ch; font-family: var(--mono); font-size: 44px; font-weight: 700; border: 0; border-bottom: 2px solid var(--ink); background: none; padding: 0 0 2px; text-align: right; color: var(--ink); border-radius: 0; }
.amount input:focus { outline: none; border-color: var(--accent); }
.amount span { font-size: 20px; color: var(--muted); }
.recap { display: grid; }
.recap div { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.recap .k { color: var(--muted); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: var(--scrim); }
.sheet-panel { width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .sheet { align-items: center; } .sheet-panel { border-radius: 16px; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; margin-bottom: 16px; }
.sheet-head .close { min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.sheet-body { display: grid; gap: 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px; }
.ing { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.steps li::marker { font-weight: 700; color: var(--accent); }
.field { display: grid; gap: 6px; }
.field > b { font-size: 16px; }
.field > small { color: var(--muted); font-size: 15px; margin-top: -2px; }
.auto-fill { font-size: 14px; color: var(--accent); font-weight: 700; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rate .btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
.howto { margin: 0; padding-left: 22px; display: grid; gap: 10px; }

/* Generating */
.gen { display: grid; gap: 16px; padding: 20px 16px; }
.gen ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.gen li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: var(--faint); }
.gen li.on { color: var(--ink); font-weight: 700; }
.gen li.done { color: var(--muted); }
.gen li .b { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; }
.gen li.done .b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gen li.on .b { border-color: var(--accent); border-top-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .gen li.on .b { animation: spin 1s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }

.loading { max-width: 680px; margin: 0 auto; padding: 80px 16px; color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: 480px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 14px 16px; border-radius: 10px; font-weight: 700; font-size: 15px; display: flex; gap: 12px; align-items: center; }
.toast .undo { margin-left: auto; color: var(--bg); text-decoration: underline; font-weight: 700; }
</style>

<p id="loading" class="loading">Chargement…</p>
<section id="onboarding" hidden></section>
<section id="main" hidden>
  <header class="topbar"><div class="topbar-in"><b>Repas &amp; Courses</b><span id="topStore"></span></div></header>

    <button class="tab" role="tab" id="tab-courses" data-act="tab" data-tab="courses" aria-selected="false"></button>
    <button class="tab" role="tab" id="tab-reglages" data-act="tab" data-tab="reglages" aria-selected="false"></button>
  </div></nav>
</section>
<div id="sheet" class="sheet" hidden><div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

/* ---------- Storage: shared database, or this device if it is unavailable or refuses writes ---------- */
const Store = (() => {
  let db = null, local = true;
  const PREFIX = "repas-courses-v2:";
  const subs = [], cache = {}, queues = {};
  const readLocal = (c) => { try { return JSON.parse(localStorage.getItem(PREFIX + c)) || {}; } catch (e) { return {}; } };
  const saveLocal = (c, v) => { cache[c] = v; try { localStorage.setItem(PREFIX + c, JSON.stringify(v)); } catch (e) {} };
  const emit = (c) => subs.filter((s) => s.col === c).forEach((s) => s.cb({ ...(cache[c] || {}) }));
  const serial = (k, fn) => (queues[k] = (queues[k] || Promise.resolve()).catch(() => {}).then(fn));
  function attach(s) {
    if (local) { cache[s.col] = readLocal(s.col); s.cb({ ...cache[s.col] }); return; }
    s.unsub = db.collection(s.col).onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = d.data(); }); cache[s.col] = o; s.cb(o);
    }, () => toast("Synchronisation interrompue. Recharge la page."));
  }
  function goLocal() {
    if (local) return;
    local = true;
    subs.forEach((s) => { try { s.unsub && s.unsub(); } catch (e) {} });
    Object.entries(cache).forEach(([c, v]) => saveLocal(c, v || {}));
    subs.forEach(attach);
    if (Store.onMode) Store.onMode();
    toast("Tes données sont enregistrées sur ce téléphone.");
  }
  async function write(op, col, id, data) {
    if (local) {
      const o = { ...readLocal(col) };
      if (op === "set") o[id] = data; else delete o[id];
      saveLocal(col, o); emit(col); return;
    }
    try {
      await serial(col + "/" + id, () => op === "set" ? db.collection(col).doc(id).set(data) : db.collection(col).doc(id).delete());
    } catch (e) {
      /* A refused write means this viewer may read but not write the shared data: keep going on this device */
      if (e && e.code === "invalid_argument") { goLocal(); return write(op, col, id, data); }
      toast(e && e.code === "quota_exceeded" ? "Stockage plein." : "Enregistrement impossible pour le moment. Réessaie.");
    }
  }
  return {
    onMode: null,
    get remote() { return !local; },
    async init() {
      try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
      local = !db; return !local;
    },
    watch(col, cb) { const s = { col, cb }; subs.push(s); attach(s); },
    set: (col, id, data) => write("set", col, id, data),
    del: (col, id) => write("del", col, id)
  };
})();

function weekStart(w) { return parseIso(w.startDate || w.weekOf || isoLocal(new Date())); }
function weekDates(w) { const s = weekStart(w); return Array.from({ length: 7 }, (_, i) => { const d = new Date(s); d.setDate(d.getDate() + i); return d; }); }
function mealDate(w, m) { return weekDates(w).find((d) => dayKeyOf(d) === m.day) || weekStart(w); }
function slotsFor(p, start) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i); const k = dayKeyOf(d);
    if (p.meals === "midis-soirs" || (p.meals === "soirs-we" && (k === "sam" || k === "dim"))) out.push([k, "midi", d]);
    out.push([k, "soir", d]);
  }
  return out;
}
function isDue(w, now = new Date()) {
  if (!w) return false;
  const since = daysBetween(weekStart(w), now);
  return since >= 7 || (dayKeyOf(now) === (P().shopDay || "sam") && since >= 4);
}
function suggestBudget(p) {
  const eq = (p.adults || 1) + 0.6 * (p.kids || 0);
  let b = eq * 40 * ({ "soirs": 0.55, "soirs-we": 0.65, "midis-soirs": 1 }[p.meals] || 0.6);
  if (p.breakfast) b += eq * 7 * 1.1;
  b *= { tout: 1, flexi: 0.93, pesco: 1.05, vege: 0.86, vegan: 0.86 }[p.diet] || 1;
  b *= { equilibre: 1, leger: 1.02, copieux: 1.08, proteines: 1.15 }[p.goal] || 1;
  b *= { tres: 0.95, simple: 1, travaille: 1.08, passion: 1.12 }[p.style] || 1;
  b *= storeOf(p.store).f || 1;
  if (p.storeBrands === false) b *= 1.2;
  return Math.max(15, Math.round(b / 5) * 5);
}

const cleanMeal = (m) => ({

let genCtl = null, prepFiles = [];
async function runJob(kind, promptText, opts, onDone) {
  if (S.busy) return;
  S.busy = kind; S.gen = { step: 0, n: 0, start: Date.now(), auto: !!opts.auto }; genCtl = new AbortController();
  if (kind !== "swap") setTab("semaine");
  renderSemaine();
  const tick = setInterval(() => { if (S.busy && S.busy !== "swap" && S.tab === "semaine") renderSemaine(); }, 1000);
  try {
    const call = { modelTier: "default", cache: false, signal: genCtl.signal, onText: ({ text }) => {
      S.gen.n = (text.match(/"slot"\s*:/g) || []).length;
      S.gen.step = text.includes('"total"') ? 3 : text.includes('"shopping"') ? 2 : 1;
    } };
    if (opts.images && opts.images.length) call.images = opts.images;
    const res = await S.sample.json(promptText, call);
    await onDone(res);
  } catch (e) {
    if (e && e.code !== "cancelled") toast(errMsg(e));
  } finally {
    clearInterval(tick); S.busy = null; S.swapping = null; S.gen = null; genCtl = null; renderAll();
  }
}
function generateWeek(prep) {

    if (!res || !Array.isArray(res.meals) || !res.meals.length) throw { code: "invalid_json" };

    const week = {
      startDate: isoLocal(start), weekOf: isoLocal(start), createdAt: Date.now(), auto: !!prep.auto, budget: P().budget, store: P().store,
      meals: res.meals.map(cleanMeal), shopping, pantry: strList(res.pantry), leftovers: strList(res.leftovers),
      total: sumShop(shopping) || Number(res.total) || 0, tips: strList(res.tips).slice(0, 4), warning: res.warning ? String(res.warning) : "",
      prep: { promos: prep.promos || "", pantry: prep.pantry || "", wishes: prep.wishes || "" }
    };
    week.meals = sortMeals(week);

function swapMeal(idx, reason) {
  const target = S.week && S.week.meals[idx]; if (!target || S.busy) return;

/* Taste learning */
function addTaste(kind, name) {
  const t = { liked: [...(S.taste.liked || [])], disliked: [...(S.taste.disliked || [])] };

  t[other] = t[other].filter((n) => n !== name);

}

/* ---------- View: semaine ---------- */
function renderGenerating() {
  const g = S.gen || { step: 0, n: 0, start: Date.now() };
  const total = slotsFor(P(), new Date()).length;
  const el = Math.floor((Date.now() - g.start) / 1000);
  const title = S.busy === "fix" ? "Je remplace les plats les plus chers" : g.auto ? "C’est ton jour de courses : je prépare la semaine" : "Je prépare ta semaine";
  const steps = S.busy === "fix"
    ? [["Je repère les repas qui coûtent le plus", 0], ["Je trouve des plats moins chers", 1], ["Je refais la liste de courses", 2], ["Je vérifie le budget", 3]]
    : [["Je relis tes goûts et les semaines passées", 0], [g.n ? `J’écris les repas : ${g.n} sur ${total}` : "J’écris les repas", 1], ["Je fais la liste et j’estime les prix", 2], ["Je vérifie le budget", 3]];
  return `<div class="box gen">
    <div><h2>${esc(title)}</h2><p class="muted">Une à deux minutes en général. <span class="money">${Math.floor(el / 60)}:${pad(el % 60)}</span></p></div>
    <ol>${steps.map(([t, s]) => `<li class="${g.step > s ? "done" : g.step === s ? "on" : ""}"><span class="b">${g.step > s ? ic("check", "sm") : ""}</span><span>${esc(t)}</span></li>`).join("")}</ol>
    <button class="btn" data-act="stop">Arrêter</button>
  </div>`;
}
function renderSemaine() {
  const box = $("#v-semaine");
  const p = P(), a = autoOf(p);
  if (S.busy && S.busy !== "swap") { box.innerHTML = renderGenerating(); return; }
  const w = S.week;
  if (!w || !w.meals) {
    box.innerHTML = `<div class="head"><h1>${p.name ? `Bonjour ${esc(p.name)}` : "Ta semaine"}</h1><p>Aucune semaine pour l’instant.</p></div>
      <div class="box pad" style="display:grid;gap:14px">
        <p>L’appli crée des repas pour ${esc(p.budget)} € maximum, avec la liste de courses pour ${esc(storeOf(p.store).name)}.</p>
        ${S.sample ? `<button class="btn primary big block" data-act="prep">Créer ma semaine</button>` : `<div class="status warn">${ic("alert")}<div><b>Connexion à Claude nécessaire</b><p>Ouvre cette page depuis claude.ai en étant connecté à ton compte.</p></div></div>`}
      </div>`;
    return;
  }
  const now = new Date(), todayIso = isoLocal(now);
  const dates = weekDates(w), first = dates[0], last = dates[6];
  const budget = Number(p.budget || w.budget) || 0;
  const over = budget && w.total > budget + 0.5;
  const due = isDue(w, now);
  const meals = w.meals.map((m, i) => ({ m, i, d: mealDate(w, m) }));
  const todays = meals.filter((x) => isoLocal(x.d) === todayIso);
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
  const aheadNotes = meals.filter((x) => isoLocal(x.d) === isoLocal(tomorrow) && x.m.ahead);
  const aheadToday = meals.filter((x) => isoLocal(x.d) === todayIso && x.m.ahead && now.getHours() < 12);
  const shop = w.shopping || [];
  const left = shop.filter((x) => !S.checked[itemKey(x)]).length;

  let status = "";
  if (due) {
    status = `<div class="status warn">${ic("calendar")}<div><b>${dayKeyOf(now) === (p.shopDay || "sam") ? "C’est ton jour de courses" : "Ta semaine est terminée"}</b>

      <div class="acts"><button class="link" data-act="prep">Préparer la nouvelle semaine</button></div></div></div>`;
  } else if (w.auto && daysBetween(first, now) === 0) {
    status = `<div class="status">${ic("auto")}<div><b>Préparée automatiquement aujourd’hui</b><p>Avec ${w.prep && w.prep.pantry ? "les restes de la semaine dernière et " : ""}ton budget. Tu peux changer n’importe quel plat.</p></div></div>`;
  }
  const budgetBlock = `<div class="box pad budget">
      <div class="top"><span class="label">Courses estimées</span><span><span class="total">${eur(w.total)}</span> <span class="of">sur ${eur(budget)}</span></span></div>
      <div class="meter${over ? " over" : ""}"><i style="width:${budget ? Math.min(100, w.total / budget * 100) : 0}%"></i></div>
      ${over ? `<p class="note over">${eur(w.total - budget)} au-dessus de ton budget.</p>${S.sample ? `<button class="btn primary block" data-act="fix">Remplacer les plats les plus chers</button>` : ""}`
        : `<p class="note">${eur(Math.max(0, budget - w.total))} de marge · ${left ? `${plural(left, "article")} à acheter` : "courses faites"} · <button class="link" data-act="tab" data-tab="courses">Voir la liste</button></p>`}
      ${w.warning ? `<p class="note">${esc(w.warning)}</p>` : ""}
    </div>`;
  const todayBlock = todays.length || aheadNotes.length ? `<div class="box today">
      <p class="when">Aujourd’hui, ${esc(dayLong(now))}</p>
      ${todays.map(({ m, i }) => `<button class="mrow${S.swapping === i ? " busy" : ""}" data-act="meal" data-i="${i}"><span class="slot">${m.slot === "midi" ? "Midi" : "Soir"}</span><span><span class="name">${esc(m.name)}</span><span class="meta" style="display:block">${S.swapping === i ? "Recherche d’un autre plat…" : [m.minutes && m.minutes + " min", m.kcal && m.kcal + " kcal"].filter(Boolean).join(" · ")}</span></span><span class="go">${ic("chevR")}</span></button>`).join("") || `<p class="mrow" style="grid-template-columns:1fr">Rien de prévu aujourd’hui.</p>`}
      ${[...aheadToday.map((x) => ["Pour ce soir", x]), ...aheadNotes.map((x) => ["Pour demain", x])].map(([t, x]) => `<div class="ahead">${ic("bell")}<span><b>${t} :</b> ${esc(x.m.ahead)}</span></div>`).join("")}
    </div>` : "";
  const byDay = dates.map((d) => [d, meals.filter((x) => isoLocal(x.d) === isoLocal(d))]).filter(([, l]) => l.length);
  const weekBlock = `<div class="section"><span class="label">La semaine</span><div class="week">${byDay.map(([d, l]) => {
      const iso = isoLocal(d), cls = iso < todayIso ? " past" : iso === todayIso ? " now" : "";
      return `<div class="wday${cls}"><div class="d">${DAYS.find((x) => x[0] === dayKeyOf(d))[2]}<small>${d.getDate()}</small></div><div class="wmeals">${l.map(({ m, i }) => `
        <button class="wmeal${S.swapping === i ? " busy" : ""}" data-act="meal" data-i="${i}"><span><span class="n">${esc(m.name)}</span>${p.meals !== "soirs" ? ` <span class="s">· ${m.slot}</span>` : ""}</span><span class="m">${S.swapping === i ? "…" : m.minutes ? m.minutes + " min" : ""}</span></button>`).join("")}</div></div>`;
    }).join("")}</div></div>`;
  const tipsBlock = w.tips && w.tips.length ? `<div class="section"><span class="label">Conseils de la semaine</span><ul class="tips">${w.tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
  box.innerHTML = `<div class="head"><h1>${p.name ? `Bonjour ${esc(p.name)}` : "Ta semaine"}</h1><p>Du ${esc(dayLong(first))} au ${esc(dayLong(last))}</p></div>
    ${status}${todayBlock}${budgetBlock}${weekBlock}${tipsBlock}
    ${!due && S.sample ? `<button class="btn block" data-act="prep">Refaire une nouvelle semaine</button>` : ""}`;
}

/* ---------- View: courses ---------- */
const itemKey = (x) => "s_" + slug(x.product || x.name);
function searchUrl(product) {
  const st = storeOf(P().store);
  if (st.search) return st.search + encodeURIComponent(product);
  return "https://www.google.com/search?q=" + encodeURIComponent((st.site ? "site:" + st.site + " " : "") + product);
}
function allItems() {
  const w = S.week, shop = (w && w.shopping) || [];
  const extras = Object.entries(S.extras).map(([id, x]) => ({ name: x.name, product: x.name, qty: "", aisle: "Autre", price: 0, extraId: id, key: "x_" + id }));
  return [...shop.map((x) => ({ ...x, key: itemKey(x) })), ...extras];
}
function driveQueue() {
  const items = allItems().filter((x) => !S.checked[x.key]);
  items.sort((a, b) => AISLE_NAMES.indexOf(a.aisle) - AISLE_NAMES.indexOf(b.aisle));
  const skip = S.skipped.filter((k) => items.some((x) => x.key === k));
  return [...items.filter((x) => !skip.includes(x.key)), ...skip.map((k) => items.find((x) => x.key === k))];
}
function renderCourses() {
  const box = $("#v-courses");
  const w = S.week, st = storeOf(P().store);
  const all = allItems();
  const leftItems = all.filter((x) => !S.checked[x.key]);
  $("#tabCount").textContent = leftItems.length || "";
  const shopTotal = sumShop((w && w.shopping) || []);
  const leftCost = leftItems.reduce((a, x) => a + (x.price || 0), 0);
  const allDone = all.length > 0 && leftItems.length === 0;
  if (S.allDone === false && allDone) toast("Tout est dans le panier. Courses terminées.");
  S.allDone = all.length ? allDone : null;
  const head = `<div class="head"><h1>Courses</h1><p>${esc(st.name)}${w ? ` · ${plural(all.length, "article")} · ≈ <span class="money">${eur(shopTotal)}</span>` : ""}</p></div>`;
  if (!all.length) {
    box.innerHTML = head + `<p class="muted">La liste se remplit toute seule quand la semaine est créée.</p>
      <form id="extraForm" class="addrow"><input class="input" id="extraName" placeholder="Ajouter un article" aria-label="Article à ajouter" autocomplete="off"><button class="btn primary" aria-label="Ajouter">${ic("plus")}</button></form>`;
    return;
  }
  const seg = `<div class="seg" role="tablist"><button role="tab" data-act="shopmode" data-mode="liste" aria-selected="${S.shopMode === "liste"}">Liste</button><button role="tab" data-act="shopmode" data-mode="drive" aria-selected="${S.shopMode === "drive"}">Mode drive</button></div>`;
  if (S.shopMode === "drive") { box.innerHTML = head + seg + renderDrive(all.length); return; }
  let html = head + seg + `<div class="progress-line"><span><b>${all.length - leftItems.length}</b> sur ${all.length} dans le panier</span>${leftCost ? `<span>reste ≈ <span class="money">${eur(leftCost)}</span></span>` : ""}</div>
    <form id="extraForm" class="addrow"><input class="input" id="extraName" placeholder="Ajouter un article" aria-label="Article à ajouter" autocomplete="off"><button class="btn primary" aria-label="Ajouter">${ic("plus")}</button></form>`;
  for (const aisle of AISLE_NAMES) {
    const list = all.filter((x) => x.aisle === aisle);
    if (!list.length) continue;
    list.sort((a, b) => (!!S.checked[a.key] - !!S.checked[b.key]));
    const n = list.filter((x) => !S.checked[x.key]).length;
    html += `<section class="aisle"><div class="label"><span>${esc(aisle)}</span><span>${n ? n : "fait"}</span></div>` + list.map((x) => {
      const done = !!S.checked[x.key];
      return `<div class="line${done ? " done" : ""}">
        <label class="tick"><input type="checkbox" data-key="${esc(x.key)}"${done ? " checked" : ""} aria-label="Pris : ${esc(x.product)}"><span>${ic("check", "sm")}</span></label>
        <div class="main">
          <span class="prod">${esc(x.product)}</span><span class="price">${x.price ? eur(x.price) : ""}</span>
          ${x.qty || x.promo ? `<span class="sub">${esc([x.qty, x.promo ? "en promo, et ça vaut le coup" : ""].filter(Boolean).join(" · "))}</span>` : ""}
          ${x.why ? `<span class="why">${esc(x.why)}</span>` : ""}
          <span class="acts">${x.extraId ? `<button class="link" data-act="rm-extra" data-id="${esc(x.extraId)}">Retirer</button>` : `<button class="link" data-act="copy" data-copy="${esc(x.product)}">Copier le nom</button><a class="link" href="${esc(searchUrl(x.product))}" target="_blank" rel="noopener">Chercher</a>`}</span>
        </div>
      </div>`;
    }).join("") + `</section>`;
  }
  if (w && w.pantry && w.pantry.length) {
    html += `<section class="aisle"><div class="label"><span>Dans tes placards ?</span><span></span></div><p class="fine" style="padding-top:8px">Coche ce que tu as déjà.${autoOf(P()).pantry ? " C’est retenu automatiquement pour la semaine suivante." : ""}</p>` + w.pantry.map((name) => {
      const k = "p_" + slug(name), done = !!S.checked[k];
      return `<div class="line${done ? " done" : ""}"><label class="tick"><input type="checkbox" data-key="${esc(k)}"${done ? " checked" : ""} aria-label="J’en ai : ${esc(name)}"><span>${ic("check", "sm")}</span></label><div class="main"><span class="prod">${esc(name)}</span><span class="price"></span></div></div>`;
    }).join("") + `</section>`;
  }
  if (shopTotal) html += `<div class="receipt-total"><span>Total estimé</span><span class="money">${eur(shopTotal)}</span></div>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" data-act="copy-list">${ic("copy")}Copier la liste</button><button class="btn" data-act="reset-list">Tout décocher</button></div>`;
  box.innerHTML = html;
}

let wake = null;
async function updateWake() {
  const want = S.tab === "courses" && autoOf(P()).awake && document.visibilityState === "visible" && !$("#main").hidden;
  try {
    if (want && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    else if (!want && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", updateWake);
function setTab(name) {
  S.tab = name;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  ["semaine", "courses", "reglages"].forEach((t) => { $("#v-" + t).hidden = t !== name; });
  if (name === "semaine") renderSemaine();
  lsSet("tab", name); window.scrollTo(0, 0); updateWake();
}

$("#tab-reglages").innerHTML = ic("gear") + "Réglages";

/* Called synchronously from a click so the browser allows the clipboard write */
function copyText(text) {
  S.lastCopied = text;
  try {
    navigator.clipboard.writeText(text).then(() => {
      const c = $("#copied"); if (c) c.textContent = "Nom copié. Colle-le dans la recherche de l’appli.";
      if (S.shopMode !== "drive" || S.tab !== "courses") toast("Copié. Colle-le dans la recherche du magasin.");
    }).catch(() => { S.lastCopied = ""; toast("La copie est bloquée sur cet appareil."); });
  } catch (e) { S.lastCopied = ""; toast("La copie est bloquée sur cet appareil."); }
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "tab") return setTab(a.dataset.tab);
  if (act === "close") return closeSheet();
  if (act === "ob-next") return obNext();
  if (act === "ob-back") return obBack();
  if (act === "prep") return openPrep();
  if (act === "stop") { if (genCtl) genCtl.abort(); return; }
  if (act === "fix") return fixBudget();
  if (act === "meal") return openMeal(Number(a.dataset.i));
  if (act === "swap") {
    let reason = a.dataset.reason || "";
    if (a.dataset.free) { reason = ($("#swapWhy").value || "").trim(); if (!reason) { toast("Écris ce que tu voudrais à la place."); return; } }
    return swapMeal(Number(a.dataset.i), reason);
  }
  if (act === "rate") {
    const m = S.week && S.week.meals[Number(a.dataset.i)]; if (!m) return;
    const kind = a.dataset.kind, on = (S.taste[kind] || []).includes(m.name);
    if (on) removeTaste(m.name); else addTaste(kind, m.name);
    openMeal(Number(a.dataset.i)); return;
  }
  if (act === "tastes") return openTastes();
  if (act === "untaste") { removeTaste(a.dataset.name); openTastes(); renderReglages(); return; }
  if (act === "install") return openInstall();
  if (act === "edit-step") return openOnboarding(Number(a.dataset.step), true);
  if (act === "shopmode") { S.shopMode = a.dataset.mode; renderCourses(); return; }
  if (act === "copy") return copyText(a.dataset.copy);
  if (act === "drive-ok") {
    const key = a.dataset.key;
    const next = driveQueue().find((x) => x.key !== key);
    if (next && autoOf(P()).copyNext) copyText(next.product);
    S.skipped = S.skipped.filter((k) => k !== key);
    Store.set("checked", key, { at: Date.now() });
    toast("Ajouté.", () => Store.del("checked", key));
    return;
  }
  if (act === "drive-skip") { const key = a.dataset.key; S.skipped = [...S.skipped.filter((k) => k !== key), key]; renderCourses(); return; }
  if (act === "rm-extra") { Store.del("extras", a.dataset.id); Store.del("checked", "x_" + a.dataset.id); return; }
  if (act === "copy-list") {
    const st = storeOf(P().store);
    const items = allItems().filter((x) => !S.checked[x.key]);
    if (!items.length) { toast("Rien à copier."); return; }
    let txt = `Courses ${st.name}\n`;
    for (const name of AISLE_NAMES) { const l = items.filter((x) => x.aisle === name); if (!l.length) continue; txt += `\n${name}\n` + l.map((x) => `- ${x.product}${x.qty ? " (" + x.qty + ")" : ""}`).join("\n") + "\n"; }
    try { navigator.clipboard.writeText(txt).then(() => toast("Liste copiée. Colle-la dans un message."), () => toast("La copie est bloquée sur cet appareil.")); } catch (err) { toast("La copie est bloquée sur cet appareil."); }
    return;
  }
  if (act === "reset-list") return armConfirm(a, "Confirmer", async () => { await clearShoppingState(); toast("Liste décochée."); });
  if (act === "clear-history") {
    if (!(S.history || []).length) { toast("Pas encore d’historique."); return; }
    return armConfirm(a, "Effacer l’historique ?", () => { Store.set("history", "log", { weeks: [] }); toast("Historique effacé."); });
  }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("#v-courses input[data-key]");
  if (c) { if (c.checked) Store.set("checked", c.dataset.key, { at: Date.now() }); else Store.del("checked", c.dataset.key); return; }
  const sa = e.target.closest("[data-setauto]");
  if (sa) {
    const p = { ...P(), auto: { ...autoOf(P()), [sa.dataset.setauto]: sa.checked } };
    S.profile = p; Store.set("settings", "profile", p);
    toast(sa.checked ? "Activé." : "Désactivé.");
    updateWake(); return;
  }
  if (e.target.id === "promoPhotos") {
    const max = S.imgLimits ? S.imgLimits.maxCount : 0;
    prepFiles = [...e.target.files].slice(0, max);
    if (e.target.files.length > max) toast(`${max} photos maximum. Les ${max} premières sont gardées.`);
    $("#photoPreview").innerHTML = "";
    prepFiles.forEach((f) => { const img = document.createElement("img"); img.alt = "Photo de promos"; img.src = URL.createObjectURL(f); $("#photoPreview").appendChild(img); });
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "extraForm") {
    e.preventDefault();
    const name = $("#extraName").value.trim(); if (!name) return;
    Store.set("extras", newId(), { name, aisle: "Autre" });
    $("#extraName").value = "";
    return;
  }
  if (e.target.id === "prepForm") {
    e.preventDefault();
    const prep = { promos: $("#promoText").value.trim(), pantry: $("#pantryText").value.trim(), wishes: $("#wishText").value.trim(), files: prepFiles };
    closeSheet(); generateWeek(prep);
  }
});

/* ---------- Boot ---------- */
(async () => {
  const samplePromise = window.claude && window.claude.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  await Store.init();
  Store.onMode = () => renderReglages();
  const seen = new Set();
  let started = false;
  const refresh = () => {
    if (seen.size < 5) return;
    if (!started) {
      started = true; $("#loading").hidden = true;
      if (!S.profile || !S.profile.done) { openOnboarding(0, false); return; }
      $("#main").hidden = false;
      const t = lsGet("tab"); setTab(["semaine", "courses", "reglages"].includes(t) ? t : "semaine");
    }
    if (!$("#onboarding").hidden) return;
    $("#main").hidden = false;
    renderMain();
  };
  Store.watch("settings", (d) => { S.profile = d.profile || null; S.taste = d.taste || { liked: [], disliked: [] }; S.autoMeta = d.auto || {}; seen.add("settings"); refresh(); });
  Store.watch("weeks", (d) => { S.week = d.current || null; seen.add("weeks"); refresh(); });
  Store.watch("history", (d) => { S.history = (d.log && d.log.weeks) || []; seen.add("history"); refresh(); });
  Store.watch("checked", (d) => { S.checked = d; seen.add("checked"); refresh(); });
  Store.watch("extras", (d) => { S.extras = d; seen.add("extras"); refresh(); });
  S.sample = await samplePromise;
  if (S.sample && S.sample.limits) { try { const lim = await S.sample.limits(); S.imgLimits = lim && lim.images ? lim.images : null; } catch (e) { S.imgLimits = null; } }
  if (started && $("#onboarding").hidden) { renderSemaine(); maybeAutoWeek(); }
})();
})();
</script>
