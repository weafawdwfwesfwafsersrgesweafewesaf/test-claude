<title>Repas & Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mobile app shell (top bar + bottom tab bar, bottom sheets); from 960px a left sidebar replaces the tab bar. */
:root {
  --bg: #F4F6F1;
  --surface: #FFFFFF;
  --surface-2: #EDF1E9;
  --ink: #121B15;
  --muted: #5E6A61;
  --faint: #8C978F;
  --line: #E1E6DC;
  --accent: #1F7A4D;
  --accent-strong: #165E3A;
  --accent-soft: #E1F1E7;
  --accent-ink: #FFFFFF;
  --orange: #D9621F;
  --orange-soft: #FCEADD;
  --danger: #C0402C;
  --danger-soft: #FBE5E0;
  --shadow: 0 1px 2px rgba(18, 27, 21, .05), 0 6px 20px rgba(18, 27, 21, .06);
  --shadow-lg: 0 -4px 30px rgba(18, 27, 21, .12);
  --scrim: rgba(12, 18, 14, .45);
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  --r-sm: 12px;
  --tabbar: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C110E; --surface: #141B16; --surface-2: #1B241E; --ink: #E7EEE9; --muted: #9AA79E; --faint: #6F7C73; --line: #242E27;
    --accent: #5CC48B; --accent-strong: #7DD4A3; --accent-soft: #163222; --accent-ink: #052012;
    --orange: #F39A5E; --orange-soft: #3A2415; --danger: #F08976; --danger-soft: #3A1B16;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25); --shadow-lg: 0 -4px 30px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C110E; --surface: #141B16; --surface-2: #1B241E; --ink: #E7EEE9; --muted: #9AA79E; --faint: #6F7C73; --line: #242E27;
  --accent: #5CC48B; --accent-strong: #7DD4A3; --accent-soft: #163222; --accent-ink: #052012;
  --orange: #F39A5E; --orange-soft: #3A2415; --danger: #F08976; --danger-soft: #3A1B16;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25); --shadow-lg: 0 -4px 30px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 26px; height: 26px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 15px; background: var(--surface-2); color: var(--ink); transition: transform .08s, background .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.outline { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.btn.lg { padding: 16px 22px; font-size: 17px; border-radius: 16px; }
.btn.block { width: 100%; }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 11px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.field-input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; min-width: 0; }
.field-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.field-input { resize: vertical; min-height: 84px; }

/* App shell */
.shell { min-height: 100%; }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); }
.appbar-in { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; min-width: 0; }
@media (max-width: 400px) { .brand { font-size: 16px; gap: 8px; } .mark { width: 30px; height: 30px; } .store-chip { padding: 6px 9px; font-size: 12px; } .appbar-in { gap: 8px; } }
.mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.appbar .spacer { flex: 1; }
.store-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 7px 11px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font-weight: 800; font-family: var(--display); }
.content { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 6px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 16px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tab { display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--faint); position: relative; }
.tab .ic { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--orange); color: var(--surface); font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab .dot:empty { display: none; }
@media (min-width: 960px) {
  .tabbar { top: 0; right: auto; width: 240px; border-top: 0; border-right: 1px solid var(--line); padding: 84px 14px 14px; background: var(--surface); }
  .tabbar-in { display: grid; grid-template-columns: 1fr; height: auto; gap: 4px; }
  .tab { grid-auto-flow: column; justify-content: start; gap: 12px; padding: 12px 14px; border-radius: 12px; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--accent-soft); }
  .tab .dot { position: static; margin-left: auto; }
  .appbar { margin-left: 240px; }
  .content { margin-left: calc(240px + max(0px, (100% - 240px - 760px) / 2)); }
  .appbar { z-index: 16; }
  .content { padding-bottom: 48px; }
}

/* Cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.card.flat { box-shadow: inset 0 0 0 1px var(--line); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.section-head h2 { font-size: 20px; }
.greet h1 { font-size: clamp(26px, 7vw, 34px); font-weight: 800; }
.greet p { color: var(--muted); margin-top: 2px; }

/* Hero (budget) */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke: var(--accent); transition: stroke-dashoffset .6s ease; }
.ring.over .val { stroke: var(--danger); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1; }
.ring .c span { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 3px; }
.hero .amount { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero .of { color: var(--muted); font-size: 14px; }
.pillrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.pill.hot { background: var(--orange-soft); color: var(--orange); }
.hero-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .hero { grid-template-columns: 1fr; justify-items: start; } }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; }
.notice.warn { background: var(--danger-soft); color: var(--danger); }
.notice.info { background: var(--accent-soft); color: var(--accent-strong); }
.notice .grow { flex: 1; }

.tips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 82%); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.tips::-webkit-scrollbar { display: none; }
.tip { scroll-snap-align: start; background: var(--orange-soft); color: var(--ink); border-radius: var(--r-sm); padding: 14px; display: flex; gap: 10px; font-size: 14px; }
.tip .ic { color: var(--orange); }

/* Day strip + meals */
.days { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; background: var(--bg); padding-block: 8px; }
.days::-webkit-scrollbar { display: none; }
.daychip { flex: none; min-width: 54px; padding: 8px 10px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: center; font-weight: 700; font-size: 14px; }
.daychip small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.daychip.today { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.daychip.today small { color: var(--accent-ink); opacity: .8; }
.dayblock { display: grid; gap: 10px; scroll-margin-top: 130px; }
.dayblock h3 { font-size: 15px; font-family: var(--body); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.dayblock h3 .today-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.meal { width: 100%; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; transition: transform .1s; }
.meal:active { transform: scale(.99); }
.meal .slotic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); }
.meal .slotic.soir { background: var(--accent-soft); color: var(--accent); }
.meal .t { min-width: 0; }
.meal .slotname { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.meal .name { font-weight: 800; font-size: 16.5px; line-height: 1.25; margin-top: 1px; }
.meal .desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.meal .meta { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.meal .meta span { display: inline-flex; align-items: center; gap: 4px; }
.meal .chev { color: var(--faint); }
.meal.busy { position: relative; overflow: hidden; pointer-events: none; }
.meal.busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent); }
@media (prefers-reduced-motion: no-preference) { .meal.busy::after { animation: shimmer 1.2s infinite; } }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* Empty + generating */
.empty-hero { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px 18px; }
.empty-hero h2 { font-size: 24px; }
.empty-hero p { color: var(--muted); max-width: 42ch; }
.illus { width: 132px; height: 132px; }
.gen { display: grid; gap: 18px; padding: 24px 20px; }
.gen-top { display: flex; align-items: center; gap: 14px; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .9s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { display: grid; gap: 12px; }
.gstep { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--faint); }
.gstep .b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.gstep.on { color: var(--ink); }
.gstep.on .b { background: var(--accent-soft); color: var(--accent); }
.gstep.done { color: var(--muted); }
.gstep.done .b { background: var(--accent); color: var(--accent-ink); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

/* Install banner */
.install { display: flex; align-items: center; gap: 12px; }
.install .phone { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.install .grow { flex: 1; min-width: 0; }
.install b { display: block; }
.install span { font-size: 13px; color: var(--muted); }

/* Shopping */
.shop-head { display: grid; gap: 12px; }
.shop-head .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.shop-head .big { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; }
.shop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.addrow { display: flex; gap: 8px; }
.addrow .btn { flex: none; }
.aisle { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.aisle-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.aisle-h .ai { width: 30px; height: 30px; border-radius: 10px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.aisle-h h3 { font-size: 15px; font-family: var(--body); font-weight: 800; flex: 1; }
.aisle-h .cnt { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 16px; border-top: 1px solid var(--line); }
.aisle-h + .item { border-top: 0; }
.check { position: relative; width: 26px; height: 26px; margin-top: 1px; cursor: pointer; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check span { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; color: transparent; transition: background .15s; }
.check input:checked + span { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.check input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.item .w { min-width: 0; }
.item .prod { font-weight: 700; text-align: left; line-height: 1.3; }
.item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.item .why { font-size: 13px; color: var(--orange); margin-top: 2px; }
.item .tagrow { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.item .r { display: grid; justify-items: end; gap: 6px; }
.item .price { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .find { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 4px 8px; border-radius: 8px; background: var(--accent-soft); }
.item.done .prod, .item.done .price { color: var(--faint); text-decoration: line-through; }
.item.done .find { opacity: .5; }

/* Profile */
.profile-card { display: flex; align-items: center; gap: 14px; }
.profile-card .avatar { width: 56px; height: 56px; font-size: 22px; }
.profile-card h2 { font-size: 22px; }
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.lrow { width: 100%; display: grid; grid-template-columns: 36px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; text-align: left; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--surface-2); }
.lrow .li { width: 36px; height: 36px; border-radius: 11px; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.lrow .ll { font-weight: 700; }
.lrow .lv { color: var(--muted); font-size: 14px; text-align: right; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .ic.sm { color: var(--faint); }
.fine { font-size: 13px; color: var(--muted); text-align: center; }

/* Onboarding */
.ob { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; max-width: 560px; margin: 0 auto; padding-inline: 16px; }
.ob-top { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.ob-bars { flex: 1; display: grid; grid-auto-flow: column; gap: 4px; }
.ob-bars i { height: 5px; border-radius: 999px; background: var(--line); }
.ob-bars i.on { background: var(--accent); }
.ob-count { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.ob-body { display: grid; align-content: start; gap: 16px; padding-block: 10px 20px; }
.ob-body h1 { font-size: clamp(28px, 7.5vw, 36px); font-weight: 800; line-height: 1.08; }
.ob-body .lead { color: var(--muted); font-size: 16px; }
.ob-body .label { font-weight: 800; font-size: 15px; margin-top: 6px; }
.ob-foot { position: sticky; bottom: 0; padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.welcome-art { display: grid; place-items: center; padding-top: 8px; }
.welcome-art svg { width: min(260px, 70vw); height: auto; }
.values { display: grid; gap: 12px; }
.value { display: flex; gap: 12px; align-items: flex-start; }
.value .vi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.value b { display: block; }
.value span { color: var(--muted); font-size: 14px; }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .12s, background .12s; }
.opt .oi { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.opt b { display: block; font-size: 16px; }
.opt small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; color: transparent; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .oi { background: var(--accent); color: var(--accent-ink); }
.opt[aria-pressed="true"] .radio { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.opt.noicon { grid-template-columns: 1fr auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 15px; }

  const readLocal = (c) => { try { return JSON.parse(localStorage.getItem(PREFIX + c)) || {}; } catch (e) { return {}; } };
  const saveLocal = (c, v) => { cache[c] = v; try { localStorage.setItem(PREFIX + c, JSON.stringify(v)); } catch (e) {} };
  const emit = (c) => subs.filter((s) => s.col === c).forEach((s) => s.cb({ ...(cache[c] || {}) }));
  const serial = (k, fn) => (queues[k] = (queues[k] || Promise.resolve()).catch(() => {}).then(fn));
  function attach(s) {
    if (local) { cache[s.col] = readLocal(s.col); s.cb({ ...cache[s.col] }); return; }
    s.unsub = db.collection(s.col).onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = d.data(); }); cache[s.col] = o; s.cb(o);
    }, () => toast("Synchronisation interrompue. Recharge la page.", "alert"));
  }
  function goLocal() {
    if (local) return;
    local = true;
    subs.forEach((s) => { try { s.unsub && s.unsub(); } catch (e) {} });
    Object.entries(cache).forEach(([c, v]) => saveLocal(c, v || {}));
    subs.forEach(attach);
    if (Store.onMode) Store.onMode();
    toast("Tes données sont enregistrées sur ce téléphone.", "phone");
  }
  async function write(op, col, id, data) {
    if (local) {
      const o = { ...readLocal(col) };
      if (op === "set") o[id] = data; else delete o[id];
      saveLocal(col, o); emit(col); return;
    }
    try {
      await serial(col + "/" + id, () => op === "set" ? db.collection(col).doc(id).set(data) : db.collection(col).doc(id).delete());
    } catch (e) {
      /* A refused write means this viewer may read but not write the shared data: keep going on this device */
      if (e && e.code === "invalid_argument") { goLocal(); return write(op, col, id, data); }
      toast(e && e.code === "quota_exceeded" ? "Stockage plein." : "Enregistrement impossible pour le moment. Réessaie.", "alert");
    }
  }
  return {
    onMode: null,
    get remote() { return !local; },
    async init() {
      try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
      local = !db; return !local;
    },
    watch(col, cb) { const s = { col, cb }; subs.push(s); attach(s); },
    set: (col, id, data) => write("set", col, id, data),
    del: (col, id) => write("del", col, id)
  };
})();

function slotsFor(p) {
  const out = [];
  for (const [d] of DAYS) {
    if (p.meals === "midis-soirs" || (p.meals === "soirs-we" && (d === "sam" || d === "dim"))) out.push([d, "midi"]);
    out.push([d, "soir"]);
  }
  return out;
}
function suggestBudget(p) {
  const eq = (p.adults || 1) + 0.6 * (p.kids || 0);
  let b = eq * 40 * ({ "soirs": 0.55, "soirs-we": 0.65, "midis-soirs": 1 }[p.meals] || 0.6);
  if (p.breakfast) b += eq * 7 * 1.1;
  b *= { tout: 1, flexi: 0.93, pesco: 1.05, vege: 0.86, vegan: 0.86 }[p.diet] || 1;
  b *= { equilibre: 1, leger: 1.02, copieux: 1.08, proteines: 1.15 }[p.goal] || 1;
  b *= { tres: 0.95, simple: 1, travaille: 1.08, passion: 1.12 }[p.style] || 1;
  b *= storeOf(p.store).f || 1;
  if (p.storeBrands === false) b *= 1.2;
  return Math.max(15, Math.round(b / 5) * 5);
}

  return `Tu es à la fois diététicien(ne) et cuisinier(ère) en France. Tu aides un foyer à faire ses menus de la semaine et sa liste de courses au meilleur prix.

${profileBlock(p)}

CETTE SEMAINE
- Semaine du ${now.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}, saison : ${seasonOf(now)}. Privilégie les fruits et légumes de saison (moins chers et meilleurs).
- Déjà à la maison (à utiliser en priorité, à ne pas racheter) : ${prep.pantry || "rien de précisé"}.
- Envies ou contraintes de la semaine : ${prep.wishes || "aucune"}.
- Promos repérées : ${prep.promos || "aucune en texte"}${prep.photos ? `. ${prep.photos} photo(s) jointe(s) du catalogue ou de l’appli : lis-y les promos et les prix.` : "."}

DÉJÀ MANGÉ CES DERNIÈRES SEMAINES
${historyBlock()}

${RULES(p)}

RÉPONSE : uniquement un objet JSON, sans texte autour, de cette forme :
{"meals":[${FORMAT_MEAL}],
 "shopping":[${FORMAT_SHOP}],
 "pantry":["Huile d’olive","Sel"],
 "total":63.40,
 "tips":["2 à 4 conseils concrets pour économiser ou gagner du temps cette semaine"],
 "warning":""}
"day" parmi lun, mar, mer, jeu, ven, sam, dim ; "slot" parmi midi, soir ; "aisle" parmi : ${AISLE_NAMES.join(" | ")}. "price" et "total" en euros (nombres). Un repas par créneau demandé, dans l’ordre de la semaine. Variante n° ${Math.floor(Math.random() * 1e6)}.`;
}
function swapPrompt(p, week, target, reason) {
  const others = week.meals.map((m) => `- ${m.day} ${m.slot} : ${m.name} (${(m.ingredients || []).join(", ")})`).join("\n");
  return `Tu es à la fois diététicien(ne) et cuisinier(ère) en France. Tu aides un foyer à ajuster ses menus de la semaine.

${profileBlock(p)}

MENUS ACTUELS DE LA SEMAINE
${others}

DÉJÀ MANGÉ CES DERNIÈRES SEMAINES
${historyBlock()}

DEMANDE : remplace UNIQUEMENT le repas « ${target.day} ${target.slot} : ${target.name} ». Raison donnée : ${reason || "envie d’autre chose"}.
Le nouveau plat doit être nettement différent de tous les autres plats de la semaine et de l’historique, respecter tout le profil et garder le budget. Garde les autres repas tels quels.
Puis refais la liste de courses complète de toute la semaine (avec le nouveau plat), avec les mêmes règles.

${RULES(p)}

RÉPONSE : uniquement un objet JSON, sans texte autour :
{"meal":${FORMAT_MEAL.replace('"day":"lun","slot":"soir"', `"day":"${target.day}","slot":"${target.slot}"`)},
 "shopping":[${FORMAT_SHOP}],
 "pantry":["…"],
 "total":63.40,
 "warning":""}
Variante n° ${Math.floor(Math.random() * 1e6)}.`;
}

/* ---------- Claude calls ---------- */
const ERR = {
  not_granted: "Autorise la page à utiliser Claude pour créer les menus.",
  sampling_disabled: "Claude n’est pas disponible sur ce compte.",
  rate_limited: "Trop de demandes pour l’instant. Réessaie dans quelques minutes.",
  session_expired: "Reconnecte-toi à claude.ai, puis réessaie.",
  invalid_json: "La réponse est arrivée incomplète. Réessaie.",
  image_rejected: "Une photo n’a pas pu être lue. Essaie avec une autre.",
  images_unavailable: "Les photos ne sont pas acceptées ici. Écris les promos en texte.",
  refused: "Je n’ai pas pu faire cette demande. Modifie le texte et réessaie."
};
const errMsg = (e) => ERR[e && e.code] || "Ça n’a pas marché cette fois. Réessaie.";
const cleanMeal = (m) => ({
  day: DAY_LABEL[m.day] ? m.day : "lun", slot: m.slot === "midi" ? "midi" : "soir",
  name: String(m.name || "Repas"), desc: String(m.desc || ""), minutes: Number(m.minutes) || null, kcal: Number(m.kcal) || null,
  tags: Array.isArray(m.tags) ? m.tags.slice(0, 4).map(String) : [], ingredients: Array.isArray(m.ingredients) ? m.ingredients.map(String) : [],
  steps: Array.isArray(m.steps) ? m.steps.map(String) : [], leftover: m.leftover ? String(m.leftover) : ""
});
const cleanShop = (list) => (Array.isArray(list) ? list : []).filter((x) => x && (x.name || x.product)).map((x) => ({
  name: String(x.name || x.product), product: String(x.product || x.name), qty: String(x.qty || ""),
  aisle: AISLE_NAMES.includes(x.aisle) ? x.aisle : "Autre", price: Math.max(0, Number(x.price) || 0), promo: !!x.promo, why: x.why ? String(x.why) : ""
}));
const sumShop = (list) => Math.round(list.reduce((a, x) => a + x.price, 0) * 100) / 100;

let genCtl = null, prepFiles = [], genTimer = null;
async function generateWeek(prep) {
  if (S.busy) return;
  S.busy = true; S.gen = { step: 0, n: 0, start: Date.now() }; genCtl = new AbortController();
  setTab("menus"); renderMenus();
  genTimer = setInterval(updateGen, 1000);
  try {
    const opts = { modelTier: "default", cache: false, signal: genCtl.signal, onText: ({ text }) => {
      const n = (text.match(/"slot"\s*:/g) || []).length;
      S.gen.n = n;
      S.gen.step = text.includes('"total"') ? 3 : text.includes('"shopping"') ? 2 : 1;
      updateGen();
    } };
    if (prep.files && prep.files.length) opts.images = prep.files;
    const res = await S.sample.json(weekPrompt(P(), { ...prep, photos: prep.files ? prep.files.length : 0 }), opts);
    if (!res || !Array.isArray(res.meals) || !res.meals.length) throw { code: "invalid_json" };
    const shopping = cleanShop(res.shopping);
    const week = {
      weekOf: new Date().toISOString().slice(0, 10), createdAt: Date.now(), budget: P().budget, store: P().store,
      meals: res.meals.map(cleanMeal), shopping, pantry: Array.isArray(res.pantry) ? res.pantry.map(String) : [],
      total: sumShop(shopping) || Number(res.total) || 0, tips: Array.isArray(res.tips) ? res.tips.map(String).slice(0, 5) : [],
      warning: res.warning ? String(res.warning) : "", prep: { promos: prep.promos || "", pantry: prep.pantry || "", wishes: prep.wishes || "" }
    };
    if (S.week && S.week.meals && S.week.meals.length) {
      const hist = [{ weekOf: S.week.weekOf, meals: S.week.meals.map((m) => m.name) }, ...(S.history || [])].slice(0, 12);
      await Store.set("history", "log", { weeks: hist });
    }
    await Store.set("weeks", "current", week);
    await Promise.all(Object.keys(S.checked).map((k) => Store.del("checked", k)));
    for (const id of Object.keys(S.extras)) if (S.checked["x_" + id]) await Store.del("extras", id);
    toast("Ta semaine est prête !", "sparkle");
  } catch (e) {
    if (e && e.code !== "cancelled") toast(errMsg(e), "alert");
  } finally {
    clearInterval(genTimer); S.busy = false; S.gen = null; genCtl = null; renderMenus(); renderCourses();
  }
}
async function swapMeal(idx, reason) {
  if (S.busy || !S.week) return;
  const target = S.week.meals[idx]; if (!target) return;
  S.busy = true; S.swapping = idx; genCtl = new AbortController();
  closeSheet(); renderMenus();
  toast("Je cherche un autre plat… (environ une minute)", "refresh");
  try {
    const res = await S.sample.json(swapPrompt(P(), S.week, target, reason), { modelTier: "default", cache: false, signal: genCtl.signal });
    if (!res || !res.meal || !res.meal.name) throw { code: "invalid_json" };
    const meal = cleanMeal({ ...res.meal, day: target.day, slot: target.slot });
    const shopping = cleanShop(res.shopping);
    const week = { ...S.week, meals: S.week.meals.map((m, i) => i === idx ? meal : m) };
    if (shopping.length) { week.shopping = shopping; week.total = sumShop(shopping) || Number(res.total) || week.total; }
    if (Array.isArray(res.pantry)) week.pantry = res.pantry.map(String);
    week.warning = res.warning ? String(res.warning) : "";
    await Store.set("weeks", "current", week);
    toast(`Nouveau plat : ${meal.name}`, "sparkle");
  } catch (e) {
    if (e && e.code !== "cancelled") toast(errMsg(e), "alert");
  } finally {
    S.busy = false; S.swapping = null; genCtl = null; renderMenus(); renderCourses();
  }
}

/* ---------- Views ---------- */
function greeting() { const h = new Date().getHours(); return h >= 5 && h < 18 ? "Bonjour" : "Bonsoir"; }
function ringSvg(pct, over) {
  const r = 46, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, pct));
  return `<svg viewBox="0 0 112 112"><circle class="track" cx="56" cy="56" r="${r}" fill="none" stroke-width="10"/><circle class="val" cx="56" cy="56" r="${r}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - v)).toFixed(1)}"/></svg>`;
}
const isStandalone = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;

function renderGenerating() {
  const g = S.gen || { step: 0, n: 0, start: Date.now() };
  const total = slotsFor(P()).length;
  const pct = g.step === 0 ? 8 : g.step === 1 ? 10 + Math.min(60, g.n / total * 60) : g.step === 2 ? 78 : 92;
  const steps = [["Je lis ton profil et ton historique", 0], [g.n ? `J’invente tes plats (${g.n}/${total})` : "J’invente tes plats", 1], ["J’estime les prix et je fais la liste", 2], ["Je vérifie le budget", 3]];
  const el = Math.floor((Date.now() - g.start) / 1000);
  return `<div class="card gen">
    <div class="gen-top"><div class="spinner"></div><div><h2 style="font-size:20px">Je prépare ta semaine</h2><p class="muted" style="font-size:14px">En général une à deux minutes · <span class="num" id="genTime">${Math.floor(el / 60)}:${String(el % 60).padStart(2, "0")}</span></p></div></div>
    <div class="bar"><i id="genBar" style="width:${pct}%"></i></div>
    <div class="steps" id="genSteps">${steps.map(([t, s]) => {
      const cls = g.step > s ? "done" : g.step === s ? "on" : "";
      return `<div class="gstep ${cls}"><span class="b">${g.step > s ? ic("check", "sm") : ""}</span>${esc(t)}</div>`;
    }).join("")}</div>
    <button class="btn outline" data-act="stop">Arrêter</button>
  </div>`;
}
function updateGen() { if (S.busy && S.swapping === null && S.tab === "menus") $("#v-menus").innerHTML = renderGenerating(); }

              <span class="meta">${m.minutes ? `<span>${ic("clock", "sm")} ${m.minutes} min</span>` : ""}${m.kcal ? `<span>${ic("flame", "sm")} ${m.kcal} kcal</span>` : ""}${m.tags[0] ? `<span style="color:var(--accent)">${esc(m.tags[0])}</span>` : ""}</span></span>
            <span class="chev">${ic("chevR")}</span>
          </button>`).join("")}

}

const itemKey = (x) => "s_" + slug(x.product || x.name);
function searchUrl(product) {
  const st = storeOf(P().store);
  if (st.search) return st.search + encodeURIComponent(product);
  return "https://www.google.com/search?q=" + encodeURIComponent((st.site ? "site:" + st.site + " " : "") + product);
}
function renderCourses() {
  const box = $("#v-courses");
  const w = S.week;
  const shop = (w && w.shopping) || [];
  const extras = Object.entries(S.extras).map(([id, x]) => ({ name: x.name, product: x.name, qty: "", aisle: x.aisle || "Autre", price: 0, extraId: id }));
  const all = [...shop, ...extras];
  const keyOf = (x) => x.extraId ? "x_" + x.extraId : itemKey(x);
  const left = all.filter((x) => !S.checked[keyOf(x)]).length;
  const doneN = all.length - left;
  $("#tabDot").textContent = left || "";
  const leftCost = shop.filter((x) => !S.checked[keyOf(x)]).reduce((a, x) => a + x.price, 0);
  const st = storeOf(P().store);
  let html = `<div class="greet"><h1>Ma liste</h1><p>${esc(st.name)}${w ? " · semaine du " + esc(frDate(w.weekOf)) : ""}</p></div>`;
  if (!all.length) {
    box.innerHTML = html + `<div class="card empty-hero"><svg class="illus" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="62" fill="var(--accent-soft)"/><path d="M30 40h12l10 44h40l8-30H48" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="98" r="6" fill="var(--accent)"/><circle cx="88" cy="98" r="6" fill="var(--accent)"/><circle cx="74" cy="60" r="8" fill="var(--orange)"/></svg><h2>Ta liste est vide</h2><p>Elle se remplit toute seule quand je crée tes menus.</p>${w ? "" : `<button class="btn primary" data-act="tab" data-tab="menus">Créer mes menus</button>`}</div>
      <form id="extraForm" class="addrow"><input class="field-input" id="extraName" placeholder="Ajouter un article" aria-label="Article à ajouter" autocomplete="off"><button class="btn primary" aria-label="Ajouter">${ic("plus")}</button></form>`;
    return;
  }
  html += `<div class="card shop-head">
      <div class="row"><div><p class="eyebrow">Dans le panier</p><p class="big num">${doneN}<span class="muted" style="font-size:18px"> / ${all.length}</span></p></div>${shop.length ? `<div style="text-align:right"><p class="eyebrow">Reste à payer</p><p class="big num" style="font-size:22px">≈ ${eur(leftCost)}</p></div>` : ""}</div>
      <div class="bar"><i style="width:${all.length ? doneN / all.length * 100 : 0}%"></i></div>
      <div class="shop-actions"><button class="btn" data-act="copy-list">${ic("copy")} Copier</button><button class="btn" data-act="done-shopping">${ic("check")} Terminé</button></div>
      <p class="muted" style="font-size:13.5px">Dans l’appli ${esc(st.name)} : touche un produit pour copier son nom, colle-le dans la recherche, puis coche-le ici.</p>
    </div>
    <form id="extraForm" class="addrow"><input class="field-input" id="extraName" placeholder="Ajouter un article (ex. papier toilette)" aria-label="Article à ajouter" autocomplete="off"><button class="btn primary" aria-label="Ajouter">${ic("plus")}</button></form>`;
  for (const [aisle, icon] of AISLES) {
    const list = all.filter((x) => x.aisle === aisle);
    if (!list.length) continue;
    list.sort((a, b) => (!!S.checked[keyOf(a)] - !!S.checked[keyOf(b)]));
    const n = list.filter((x) => !S.checked[keyOf(x)]).length;
    html += `<section class="aisle"><div class="aisle-h"><span class="ai">${ic(icon, "sm")}</span><h3>${esc(aisle)}</h3><span class="cnt">${n ? n : ic("check", "sm")}</span></div>` + list.map((x) => {
      const k = keyOf(x), done = !!S.checked[k];
      return `<div class="item${done ? " done" : ""}">
        <label class="check"><input type="checkbox" data-key="${esc(k)}"${done ? " checked" : ""} aria-label="Pris : ${esc(x.product)}"><span>${ic("check", "sm")}</span></label>
        <div class="w">
          <button type="button" class="prod" data-act="copy" data-copy="${esc(x.product)}">${esc(x.product)}</button>
          ${x.qty || x.name !== x.product ? `<div class="sub">${esc([x.qty, x.name !== x.product ? x.name : ""].filter(Boolean).join(" · "))}</div>` : ""}
          ${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}
          ${x.promo ? `<div class="tagrow"><span class="pill hot">${ic("tag", "sm")} Promo rentable</span></div>` : ""}
        </div>
        <div class="r">${x.price ? `<span class="price">${eur(x.price)}</span>` : ""}${x.extraId ? `<button class="iconbtn" data-act="rm-extra" data-id="${esc(x.extraId)}" aria-label="Retirer ${esc(x.name)}">${ic("trash", "sm")}</button>` : `<a class="find" href="${esc(searchUrl(x.product))}" target="_blank" rel="noopener">${ic("search", "sm")} Chercher</a>`}</div>
      </div>`;
    }).join("") + `</section>`;
  }
  if (w && w.pantry && w.pantry.length) {
    html += `<section class="aisle"><div class="aisle-h"><span class="ai">${ic("box", "sm")}</span><h3>À vérifier dans tes placards</h3></div>` + w.pantry.map((name) => {
      const k = "p_" + slug(name), done = !!S.checked[k];
      return `<div class="item${done ? " done" : ""}"><label class="check"><input type="checkbox" data-key="${esc(k)}"${done ? " checked" : ""} aria-label="J’en ai : ${esc(name)}"><span>${ic("check", "sm")}</span></label><div class="w"><span class="prod">${esc(name)}</span><div class="sub">Coche si tu en as. Sinon, ajoute-le à la liste.</div></div><div class="r"></div></div>`;
    }).join("") + `</section>`;
  }
  box.innerHTML = html;
}

function renderProfil() {
  const p = P();
  const hist = (S.history || []).length;
  $("#v-profil").innerHTML = `
    <div class="card profile-card"><span class="avatar">${esc((p.name || "?").charAt(0).toUpperCase())}</span><div><h2>${esc(p.name || "Mon profil")}</h2><p class="muted">${esc(STEPS[1].value(p))} · ${esc(storeOf(p.store).name)} · ${esc(p.budget)} €/sem.</p></div></div>
    <div class="section-head"><h2>Mes préférences</h2></div>
    <div class="list">${STEPS.map((s, i) => s.value ? `<button class="lrow" data-act="edit-step" data-step="${i}"><span class="li">${ic(s.icon)}</span><span class="ll">${esc(s.title)}</span><span class="lv">${esc(s.value(p))}</span>${ic("chevR", "sm")}</button>` : "").join("")}</div>
    <div class="section-head"><h2>Appli</h2></div>
    <div class="list">
      <button class="lrow" data-act="install"><span class="li">${ic("phone")}</span><span class="ll">Installer sur mon téléphone</span><span class="lv"></span>${ic("chevR", "sm")}</button>
      <button class="lrow" data-act="clear-history"><span class="li">${ic("history")}</span><span class="ll">Historique des menus</span><span class="lv">${plural(hist, "semaine")}</span>${ic("chevR", "sm")}</button>
    </div>
    <p class="fine">${Store.remote ? "Synchronisé avec ton compte Claude." : "Données enregistrées sur cet appareil."} L’historique sert à ne jamais reproposer les mêmes plats.</p>`;
}

function renderMain() {
  const p = P();
  $("#brandMark").innerHTML = ic("utensils");
  $("#storeChip").innerHTML = ic("store", "sm") + esc(storeOf(p.store).name);
  $("#avatarBtn").textContent = (p.name || "?").charAt(0).toUpperCase();
  renderMenus(); renderCourses(); renderProfil();
}
function setTab(name) {
  S.tab = name;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  ["menus", "courses", "profil"].forEach((t) => { $("#v-" + t).hidden = t !== name; });
  if (name === "menus" && S.busy && S.swapping === null) updateGen();
  lsSet("tab", name); window.scrollTo(0, 0);
}
$("#tab-menus").innerHTML = ic("utensils") + "Menus";
$("#tab-courses").innerHTML = ic("cart") + `Courses<span class="dot" id="tabDot"></span>`;
$("#tab-profil").innerHTML = ic("user") + "Profil";

/* ---------- Events ---------- */
document.addEventListener("click", async (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "tab") return setTab(a.dataset.tab);
  if (act === "close") return closeSheet();
  if (act === "ob-next") return obNext();
  if (act === "ob-back") return obBack();
  if (act === "prep") return openPrep();
  if (act === "stop") { if (genCtl) genCtl.abort(); return; }
  if (act === "meal") return openMeal(Number(a.dataset.i));
  if (act === "seg") {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-selected", String(b === a)));
    $("#seg-ing").hidden = a.dataset.seg !== "ing"; $("#seg-steps").hidden = a.dataset.seg !== "steps"; return;
  }
  if (act === "swap") {
    let reason = a.dataset.reason || "";
    if (a.dataset.free) { reason = ($("#swapWhy").value || "").trim(); if (!reason) { toast("Écris ce que tu voudrais à la place", "alert"); return; } }
    return swapMeal(Number(a.dataset.i), reason);
  }
  if (act === "jump") { const el = document.getElementById("day-" + a.dataset.day); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (act === "install") return openInstall();
  if (act === "install-done" || act === "install-dismiss") { lsSet("installDismissed", "1"); closeSheet(); renderMenus(); return; }
  if (act === "edit-step") return openOnboarding(Number(a.dataset.step), true);
  if (act === "copy") {
    try { await navigator.clipboard.writeText(a.dataset.copy); toast("Copié : colle-le dans la recherche du magasin", "copy"); }
    catch (err) { const r = document.createRange(); r.selectNodeContents(a); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Sélectionné : copie-le avec ton doigt", "copy"); }
    return;
  }
  if (act === "rm-extra") { Store.del("extras", a.dataset.id); Store.del("checked", "x_" + a.dataset.id); return; }
  if (act === "copy-list") {
    const w = S.week || {}, st = storeOf(P().store);
    const items = [...(w.shopping || []), ...Object.entries(S.extras).map(([id, x]) => ({ product: x.name, aisle: x.aisle || "Autre", extraId: id, qty: "" }))]
      .filter((x) => !S.checked[x.extraId ? "x_" + x.extraId : itemKey(x)]);
    if (!items.length) { toast("Rien à copier", "alert"); return; }
    let txt = `Courses ${st.name}${w.weekOf ? " · semaine du " + frDate(w.weekOf) : ""}\n`;
    for (const name of AISLE_NAMES) { const l = items.filter((x) => x.aisle === name); if (!l.length) continue; txt += `\n${name}\n` + l.map((x) => `- ${x.product}${x.qty ? " (" + x.qty + ")" : ""}`).join("\n") + "\n"; }
    try { await navigator.clipboard.writeText(txt); toast("Liste copiée : colle-la dans un message", "copy"); } catch (err) { toast("La copie est bloquée sur cet appareil", "alert"); }
    return;
  }
  if (act === "done-shopping") return armConfirm(a, "Tout décocher ?", async () => {
    const ops = Object.keys(S.checked).map((k) => Store.del("checked", k));
    Object.keys(S.extras).forEach((id) => { if (S.checked["x_" + id]) ops.push(Store.del("extras", id)); });
    await Promise.all(ops); toast("Liste remise à zéro");
  });
  if (act === "clear-history") {
    if (!(S.history || []).length) { toast("Pas encore d’historique", "history"); return; }
    return armConfirm(a, "Effacer l’historique ?", () => { Store.set("history", "log", { weeks: [] }); toast("Historique effacé"); });
  }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("#v-courses input[data-key]");
  if (c) { if (c.checked) Store.set("checked", c.dataset.key, { at: Date.now() }); else Store.del("checked", c.dataset.key); return; }
  if (e.target.id === "promoPhotos") {
    const max = S.imgLimits ? S.imgLimits.maxCount : 0;
    prepFiles = [...e.target.files].slice(0, max);
    if (e.target.files.length > max) toast(`${max} photos maximum : j’ai gardé les ${max} premières.`, "camera");
    $("#photoPreview").innerHTML = "";
    prepFiles.forEach((f) => { const img = document.createElement("img"); img.alt = "Photo de promos"; img.src = URL.createObjectURL(f); $("#photoPreview").appendChild(img); });
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "extraForm") {
    e.preventDefault();
    const name = $("#extraName").value.trim(); if (!name) return;
    Store.set("extras", newId(), { name, aisle: "Autre" });
    $("#extraName").value = "";
    return;
  }
  if (e.target.id === "prepForm") {
    e.preventDefault();
    const prep = { promos: $("#promoText").value.trim(), pantry: $("#pantryText").value.trim(), wishes: $("#wishText").value.trim(), files: prepFiles };
    closeSheet(); generateWeek(prep);
  }
});

/* ---------- Boot ---------- */
(async () => {
  const samplePromise = window.claude && window.claude.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  await Store.init();
  Store.onMode = () => renderProfil();
  const seen = new Set();
  let started = false;
  const refresh = () => {
    if (seen.size < 5) return;
    if (!started) {
      started = true; $("#loading").hidden = true;
      if (!S.profile || !S.profile.done) { openOnboarding(0, false); return; }
      $("#main").hidden = false;
      const t = lsGet("tab"); setTab(["menus", "courses", "profil"].includes(t) ? t : "menus");
    }
    if (!$("#onboarding").hidden) return;
    $("#main").hidden = false;
    renderMain();
  };
  Store.watch("settings", (d) => { S.profile = d.profile || null; seen.add("settings"); refresh(); });
  Store.watch("weeks", (d) => { S.week = d.current || null; seen.add("weeks"); refresh(); });
  Store.watch("history", (d) => { S.history = (d.log && d.log.weeks) || []; seen.add("history"); refresh(); });
  Store.watch("checked", (d) => { S.checked = d; seen.add("checked"); refresh(); });
  Store.watch("extras", (d) => { S.extras = d; seen.add("extras"); refresh(); });
  S.sample = await samplePromise;
  if (S.sample && S.sample.limits) { try { const lim = await S.sample.limits(); S.imgLimits = lim && lim.images ? lim.images : null; } catch (e) { S.imgLimits = null; } }
  if (started && $("#onboarding").hidden) renderMenus();
})();
})();
</script>
