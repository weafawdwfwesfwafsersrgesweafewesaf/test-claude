name: Build OpenWall

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwall/**'
      - '.github/workflows/openwall.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openwall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openwall/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWall-Windows
          path: openwall/dist/*.exe
          if-no-files-found: error
