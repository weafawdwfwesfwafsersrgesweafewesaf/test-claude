name: Build OpenWall

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwall/**'
      - '.github/workflows/openwall.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openwall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openwall/package-lock.json
      - run: npm ci
      - id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWall-Windows
          path: openwall/dist/*.exe
          if-no-files-found: error
      # Publie les .exe dans une Release : lien de téléchargement direct
      # https://github.com/<owner>/<repo>/releases/latest/download/OpenWall-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: openwall-v${{ steps.ver.outputs.version }}
          name: OpenWall ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            Fonds d'écran animés gratuits pour Windows.
            - **OpenWall-Setup.exe** : installateur
            - **OpenWall-Portable.exe** : version portable, sans installation
          files: |
            openwall/dist/OpenWall-Setup.exe
            openwall/dist/OpenWall-Portable.exe
