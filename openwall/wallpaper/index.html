<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OpenWall – fond d'écran</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; opacity: 0; overflow: hidden; will-change: opacity; }
  .layer.visible { opacity: 1; }
  .content { position: absolute; inset: 0; overflow: hidden; }
  .content video, .content img.wp-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .parallax { position: absolute; inset: 0; will-change: transform; }
  .content iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: transparent; }
  .vignette { position: absolute; inset: 0; pointer-events: none; }
  .overlay-clock { position: absolute; font-family: "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 200; line-height: 1; text-align: center; pointer-events: none; white-space: nowrap; }
  .overlay-clock .date { font-size: 0.24em; font-weight: 400; margin-top: 0.25em; letter-spacing: 0.04em; opacity: 0.9; }
  .overlay-clock .ampm { font-size: 0.35em; margin-left: 0.15em; }
  .pos-center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pos-top-left { left: 4%; top: 6%; text-align: left; }
  .pos-top-center { left: 50%; top: 6%; transform: translateX(-50%); }
  .pos-top-right { right: 4%; top: 6%; text-align: right; }
  .pos-bottom-left { left: 4%; bottom: 8%; text-align: left; }
  .pos-bottom-center { left: 50%; bottom: 8%; transform: translateX(-50%); }
  .pos-bottom-right { right: 4%; bottom: 8%; text-align: right; }
  .overlay-viz { position: absolute; left: 0; width: 100%; pointer-events: none; }
  @keyframes kenburns {
    0% { transform: scale(1) translate(0, 0); }
    50% { transform: scale(1.18) translate(-2%, -1.5%); }
    100% { transform: scale(1.08) translate(2%, 1.5%); }
  }
  .error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #889; font: 16px "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../shared/schemas.js"></script>
<script src="../shared/scenes.js"></script>
<script src="wallpaper.js"></script>
</body>
</html>
